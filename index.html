<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cyber Daily 10</title>
  <meta name="description" content="Ten cybersecurity questions a day.">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cyber Daily">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div>
        <h1 class="wordmark">Cyber Daily <span>10</span></h1>
        <div class="today" id="today"></div>
      </div>
      <div class="streak" id="streak">
        <div class="streak-label">Streak</div>
        <div class="streak-value"><span id="streakCount">0</span><small id="streakUnit">days</small></div>
      </div>
    </header>

    <main id="main">
      <p class="status">Loading questions…</p>
    </main>
  </div>

  <div class="actionbar" id="actionbar" hidden>
    <div class="actionbar-inner" id="actionbarInner"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
